schema_version: "1.0"

geo:
  default_region: "SEA"
  fallback_region: "global"
  boost_countries:
    - Singapore
    - Malaysia
    - Indonesia
    - Thailand
    - Vietnam
    - Philippines
    - Brunei
    - Cambodia
    - Laos
    - Myanmar

budgets:
  product_exact_price:
    max_search_calls: 4
    max_fetch_urls: 20
    max_candidates_to_extract: 10
    max_validated_candidates: 5
    max_runtime_seconds: 180
    min_validated_candidates: 5
    evidence_completeness_threshold: 0.75
  service_quote_required:
    max_search_calls: 5
    max_fetch_urls: 25
    max_candidates_to_extract: 10
    max_validated_candidates: 5
    max_runtime_seconds: 180
    min_validated_candidates: 3
    evidence_completeness_threshold: 0.65
  contact_enrichment_only:
    max_search_calls: 3
    max_fetch_urls: 15
    max_candidates_to_extract: 10
    max_validated_candidates: 5
    max_runtime_seconds: 120
    min_validated_candidates: 1
    evidence_completeness_threshold: 0.70

privacy:
  review_gate_enabled:
    business_contact: false
    named_person_high_sensitivity: true
  high_sensitivity_fields:
    - named_person_email
    - named_person_phone
    - direct_mobile

# Canonical Qwen model role assignments (build plan section 2). Never hard-code
# model strings in code; resolve through Policy.model_for(<role>). Override any
# role at runtime with env SPIDER_QWEN_MODEL_<ROLE> (e.g. SPIDER_QWEN_MODEL_PLANNER).
# Pin dated snapshots for demo reproducibility; the rolling alias can change
# planner behaviour mid-run.
models:
  planner: "qwen3.7-max"            # planning / reasoning / high-stakes judging (deep-thinking ON, 1M ctx)
  extraction: "qwen3.5-flash"       # extraction / classification / query-variants / reflection (thinking OFF)
  extraction_fallback: "qwen-flash" # fallback when the flash snapshot is unavailable
  embeddings: "text-embedding-v4"   # skills / notes / FFF specs (Matryoshka 768d index, 2048d rerank)
  ocr: "qwen-vl-ocr-2025-11-20"     # datasheet / legacy-book OCR

# T-7.3 cost router pricing. USD per 1K tokens, per model. Illustrative values;
# override with your contracted rates. The router sends cheap/high-volume steps
# (extraction/classification/judge) to flash and only planning/reasoning/
# high-risk decisions to max; the dashboard reports $-saved-vs-all-max.
pricing:
  qwen3.7-max: { input: 0.0024, output: 0.0096 }
  qwen3.5-flash: { input: 0.0003, output: 0.0006 }
  qwen-flash: { input: 0.0002, output: 0.0004 }
  text-embedding-v4: { input: 0.00007, output: 0.0 }
  qwen-vl-ocr-2025-11-20: { input: 0.0010, output: 0.0010 }

qwen:
  # Model names live in the models: block above. Legacy router_model /
  # json_extractor_model keys are still honoured if present (backward compat).
  structured_extraction_enabled: false
  router_fallback_enabled: false
  router_confidence_threshold: 0.65
  # T-2.1 page judge gate: score each fetched page (relevance/freshness/authority/
  # contradicts-ledger) and reject/flag low-trust pages before the ledger persists.
  # Heuristic + offline by default; off so the base offline pipeline is unchanged.
  page_judge_enabled: false
  # Finding-6 fetch retry: transport_error / js_shell fetch outcomes earn one
  # second attempt through the Qwen web_extractor tool (live model call per
  # URL, max 3 per fetch batch). Env QWEN_FETCH_FALLBACK_ENABLED.
  fetch_fallback_enabled: false
  # Frontier re-scoring seam: Qwen proposes per-lead score deltas over the
  # gather frontier; the deterministic side clamps them (+/- 0.2) and keeps
  # admission authority. Env QWEN_FRONTIER_SCORER_ENABLED. Needs frontier.enabled.
  frontier_scorer_enabled: false

page_cache:
  # Cross-run read-through page cache under <state_dir>/page_cache, keyed by
  # canonical URL. A hit inside ttl_seconds skips the provider call and
  # consumes no fetch budget; the page is still judged and re-recorded in the
  # new run's ledger with cache provenance. Only ok-classified pages are
  # cached (never bot walls / JS shells / thin pages). Env
  # SPIDER_QWEN_PAGE_CACHE_ENABLED / SPIDER_QWEN_PAGE_CACHE_TTL_SECONDS.
  enabled: false
  ttl_seconds: 86400

retrieval_recipes:
  # Versioned application-owned search/fetch recipes. Shadow findings are
  # evaluated and retained for comparison but never alter candidate outputs.
  enabled: false

frontier:
  # Frontier gather: queries and 1-hop page links (same-domain contact pages,
  # directory entries) compete on one scored priority queue; the fetch budget
  # is drained best-first instead of in SERP discovery order. Same budget caps
  # as the linear path. Env SPIDER_QWEN_FRONTIER_ENABLED. Off by default; the
  # judged-demo profile enables it.
  enabled: false

verification:
  # T-2.2 verification spine: atomic decomposition -> MiniCheck entailment ->
  # SAFE re-verification. Blocks candidates whose critical claims are not grounded
  # in their cited evidence. Heuristic + offline by default; off so the base
  # offline pipeline is unchanged. Env SPIDER_QWEN_VERIFICATION_ENABLED.
  enabled: false

source_reliability:
  # T-2.4 per-source reliability prior; multiplies into per-claim (effective)
  # confidence. Runtime defaults live in governance/source_reliability.py; the
  # values here override them. Manufacturer datasheet highest, marketplace lowest.
  manufacturer: 0.99
  distributor: 0.95
  government: 0.9
  aggregator: 0.85
  business: 0.6
  broker: 0.5
  unknown: 0.4
  marketplace: 0.2

rfq:
  allow_vendor_submission: false
  default_tone: "SEA-neutral professional English; short and direct"
  minimum_checklist_completeness: 0.65
  # GRADE floor for auto-releasing a draft. GRADE decouples evidence certainty
  # from action strength: the per-claim grade is advisory input, this policy is
  # the action. Drafts whose evidence_grade is BELOW the floor are held for
  # human review instead of released. "very_low" (the lowest grade) means no
  # draft is ever held on grade alone -- the grade stays advisory. Raise to
  # "low" or "moderate" to gate RFQ-bound facts on evidence certainty.
  grade_floor: very_low

memory:
  semantic_promotion_requires_evidence: true
  allow_disputed_facts_in_rfq: false

hitl:
  enabled: true
  require_review: false
