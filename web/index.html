<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spider-Qwen · Workspace</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="tokens.css"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="icon" type="image/png" href="assets/logo-darkmode.png"/>
</head>
<body data-density="comfortable">

<div id="root"></div>

<!-- Vendored (web/vendor/, pinned react@18.3.1 + @babel/standalone@7.29.0) so
     the demo runs with no internet; production React builds for speed. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>

<!-- API client + result->view-model mapper (plain JS, no JSX) -->
<script src="api.js"></script>
<script src="webmcp.js"></script>

<!-- tweaks panel starter -->
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- component library (order matters: primitives, then composites) -->
<script type="text/babel" src="components/Icon.jsx"></script>
<script type="text/babel" src="components/Sidebar.jsx"></script>
<script type="text/babel" src="components/CommandBar.jsx"></script>
<script type="text/babel" src="components/Pipeline.jsx"></script>
<script type="text/babel" src="components/HeroIdle.jsx"></script>
<script type="text/babel" src="components/HuntInProgress.jsx"></script>
<script type="text/babel" src="components/Shortlist.jsx"></script>
<script type="text/babel" src="components/VendorDetail.jsx"></script>
<script type="text/babel" src="components/RfqDrawer.jsx"></script>
<script type="text/babel" src="components/Signals.jsx"></script>

<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakButton } = window;

  // -------------------- TWEAKABLE DEFAULTS --------------------
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density":      "comfortable",
    "agentTheatre": "moderate",
    "signalFeed":   "rail",
    "showRailIdle": true
  }/*EDITMODE-END*/;

  const SEA = ["Singapore","Malaysia","Indonesia","Thailand","Vietnam","Philippines","Brunei","Cambodia","Laos","Myanmar"];
  function detectGeo(q) {
    const hit = SEA.find(c => (q || "").toLowerCase().includes(c.toLowerCase()));
    return hit ? `${hit} · SEA-first` : "SEA-first · global fallback";
  }

  function App() {
    const t = useTweaks(TWEAK_DEFAULTS);
    const setTweak = t.setTweak;
    useEffect(() => { document.body.setAttribute("data-density", t.density); }, [t.density]);

    const [screen, setScreen]   = useState("idle");   // idle | hunting | results
    const [nav, setNav]         = useState("hunt");
    const [tab, setTab]         = useState("suppliers");
    const [query, setQuery]     = useState("Find office cleaning vendors in Singapore and prepare RFQ drafts");
    const [requirementText, setRequirementText] = useState("");
    const [requirementsConfirmed, setRequirementsConfirmed] = useState(false);
    const [supplierSourceText, setSupplierSourceText] = useState("");
    function updateQuery(value) { setQuery(value); setRequirementsConfirmed(false); }
    const [focusId, setFocusId] = useState(null);
    const [detailVendor, setDetailVendor] = useState(null);
    const [draftVendor, setDraftVendor]   = useState(null);
    const [toast, setToast]               = useState(null);
    const [error, setError]               = useState(null);
    const [recent, setRecent]             = useState(() => window.SQDATA.recentRuns());

    const [view, setView]       = useState(null);     // mapped result
    const [running, setRunning] = useState(false);
    const [stream, setStream]   = useState([]);
    const [evidence, setEvidence] = useState([]);
    const [activePhase, setActivePhase] = useState("classify");
    const [progress, setProgress] = useState(0);

    const timeoutsRef  = useRef([]);
    const intervalsRef = useRef([]);
    const resultRef    = useRef(null);   // mapped view-model while a run is in flight
    const classifyRef  = useRef(null);

    function clearAllTimers() {
      timeoutsRef.current.forEach(clearTimeout);
      intervalsRef.current.forEach(clearInterval);
      timeoutsRef.current = [];
      intervalsRef.current = [];
    }
    useEffect(() => () => clearAllTimers(), []);

    const activeRunRef = useRef(null);
    const generationRef = useRef(0);
    const cancelRequestedRef = useRef(false);
    const [profileLabel, setProfileLabel] = useState("Loading deployment profile…");
    useEffect(() => {
      window.SQAPI.config().then(c => {
        const profile = (c.profiles || []).find(p => p.name === c.default_profile);
        setProfileLabel(`${c.default_profile} · ${profile && profile.offline ? "fixture results" : "live research"}`);
      }).catch(() => setProfileLabel("Deployment profile unavailable"));
    }, []);

    async function startHunt() {
      const q = query.trim();
      if (!q || activeRunRef.current || running) return;
      const generation = ++generationRef.current;
      cancelRequestedRef.current = false;
      clearAllTimers();
      window.SQWebMCP.clear();
      setError(null);
      resultRef.current = null;
      classifyRef.current = null;
      setScreen("hunting");
      setRunning(true);
      setNav("hunt");
      setStream([]);
      setEvidence([]);
      setProgress(0);
      setActivePhase(null);
      setFocusId(null);
      const started = Date.now();
      let after = 0;
      try {
        const config = await window.SQAPI.config();
        const run = await window.SQAPI.start(q, {
          profile: config.default_profile,
          idempotencyKey: crypto.randomUUID(),
          requirements: requirementText.split("\n").map(t => t.trim()).filter(Boolean).map(text => {
            const match = text.match(/^(preferred|exclusion|mandatory):\s*(.+)$/i);
            return { text: match ? match[2] : text, kind: match ? match[1].toLowerCase() : "mandatory", scope: "supplier" };
          }),
          requirementsConfirmed,
          supplierSources: supplierSourceText.split("\n").filter(t => t.trim()).reduce((sources, line) => {
            const [name, origin] = line.split("|").map(t => t.trim());
            sources[name || ""] = [...(sources[name] || []), origin || ""];
            return sources;
          }, {}),
        });
        activeRunRef.current = run.run_id;
        if (cancelRequestedRef.current) await window.SQAPI.cancel(run.run_id);
        const poll = async () => {
          try {
            const [status, response] = await Promise.all([
              window.SQAPI.status(run.run_id), window.SQAPI.events(run.run_id, after),
            ]);
            if (generation !== generationRef.current) return;
            const events = Array.isArray(response) ? response : response.events || [];
            if (events.length) {
              after = Math.max(after, ...events.map(e => e.id || e.event_id || 0));
              const lines = events.map(e => window.SQMAP.runEventLine(e, Date.parse(run.created_at) || started));
              setStream(prev => [...prev, ...lines]);
              const phase = [...lines].reverse().find(line => line.phase !== "run");
              if (phase) setActivePhase(phase.phase);
            }
            const state = status.status.toLowerCase();
            if (state === "completed") {
              if (events.length === 100) {
                timeoutsRef.current.push(setTimeout(poll, 0));
                return;
              }
              const result = await window.SQAPI.result(run.run_id);
              if (generation !== generationRef.current) return;
              activeRunRef.current = null;
              resultRef.current = window.SQMAP.mapResult(result);
              setEvidence(resultRef.current.ledger);
              return commitResult(resultRef.current);
            }
            if (["cancelled", "canceled"].includes(state)) {
              activeRunRef.current = null;
              setRunning(false);
              setScreen("idle");
              setProgress(0);
              return;
            }
            if (["failed", "timed_out", "interrupted"].includes(state)) {
              activeRunRef.current = null;
              throw new Error(status.error || `Run ${state}. Start a new run to retry.`);
            }
            timeoutsRef.current.push(setTimeout(poll, 300));
          } catch (err) {
            if (generation !== generationRef.current) return;
            if (activeRunRef.current) {
              setError(`Unable to refresh run status: ${err.message}. Retrying; cancellation remains available.`);
              timeoutsRef.current.push(setTimeout(poll, 2000));
            } else failRun(err);
          }
        };
        await poll();
      } catch (err) { if (generation === generationRef.current) failRun(err); }
    }

    function commitResult(v) {
      clearAllTimers();
      if (classifyRef.current) v.classify = classifyRef.current;
      setView(v);
      window.SQWebMCP.setCurrentRun(v.result.run_id);
      setRunning(false);
      setProgress(1);
      setActivePhase("persist");
      setScreen("results");
      setTab("suppliers");
      setFocusId(v.vendors[0] ? v.vendors[0].id : null);
      const list = window.SQDATA.pushRecentRun(v.result);
      setRecent(list);
      // Delayed signal intercept, mirroring the design.
      const riskSig = v.signals.find(s => s.kind === "risk") || v.signals[0];
      if (riskSig) {
        const id = setTimeout(() => setToast(riskSig), 6000);
        timeoutsRef.current.push(id);
      }
    }

    function failRun(err) {
      clearAllTimers();
      setError(String(err && err.message || err));
      setRunning(false);
      setProgress(0);
      setScreen("idle");
    }

    async function haltHunt() {
      cancelRequestedRef.current = true;
      setStream(prev => [...prev, { phase: "run", t: 0, text: "Cancellation requested; waiting for the worker to stop." }]);
      if (!activeRunRef.current) return;
      try { await window.SQAPI.cancel(activeRunRef.current); }
      catch (err) { setError(String(err.message || err)); }
    }

    function backToIdle() {
      if (running || activeRunRef.current) { haltHunt(); return; }
      window.SQWebMCP.clear();
      clearAllTimers();
      setScreen("idle");
      setRunning(false);
      setProgress(0);
      setStream([]);
      setEvidence([]);
      setFocusId(null);
      setError(null);
    }

    function handleNav(k) {
      setNav(k);
      if (k === "shortlist") { setScreen(view ? "results" : "idle"); setTab("suppliers"); if (view && !focusId) setFocusId(view.vendors[0] && view.vendors[0].id); }
      else if (k === "insights")  { if (view) { setScreen("results"); setTab("insights"); } }
      else if (k === "contracts") { if (view) { setScreen("results"); setTab("contracts"); } }
      else if (k === "signals")   { if (view) { setScreen("results"); setTab("risks"); } }
      else if (k === "rfq" || k === "ledger") { if (view) setScreen("results"); }
    }

    const showRail = (screen !== "hunting") && t.signalFeed === "rail" && (screen !== "idle" || t.showRailIdle);
    const railSignals = view ? view.signals : [];
    const railLedger  = view ? view.ledger : [];

    return (
      <React.Fragment>
        <TweaksPanel>
          <TweakSection label="Layout">
            <TweakRadio label="Density" value={t.density}
              options={[{ value: "comfortable", label: "Editorial" }, { value: "dense", label: "Ops cockpit" }]}
              onChange={v => setTweak("density", v)} />
            <TweakRadio label="Signal feed" value={t.signalFeed}
              options={[{ value: "rail", label: "Side rail" }, { value: "toast", label: "Toast only" }]}
              onChange={v => setTweak("signalFeed", v)} />
          </TweakSection>
          <TweakSection label="Signals">
            <TweakToggle label="Show rail on idle" value={t.showRailIdle} onChange={v => setTweak("showRailIdle", v)} />
          </TweakSection>
          <TweakSection label="Demo">
            <TweakButton label="Replay hunt"              onClick={startHunt}/>
            <TweakButton label="Reset to idle"            onClick={backToIdle}/>
            <TweakButton label="Trigger signal intercept" onClick={() => setToast((view && view.signals[0]) || { id: "s", kind: "info", ovl: "No run yet", title: "Run a hunt first", meta: "" })}/>
          </TweakSection>
        </TweaksPanel>

        <Sidebar active={nav} onNav={handleNav} onNewRun={backToIdle} runState={running ? "running" : "idle"}
          runMeta={view ? {
            seams: view.qwen.label,
            mode: view.result.mode.replace("_required", "").replace("_only", ""),
            ledger: view.ledger.length
              ? (view.ledger.length === 1 ? view.ledger[0].id : `${view.ledger[0].id} … ${view.ledger[view.ledger.length - 1].id}`)
              : "empty",
          } : null} />

        <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
          <div role="status" style={{ padding: "6px 28px", fontSize: 11, color: "var(--sq-slate-taupe)" }}>{profileLabel}</div>
          {screen === "idle" && (
            <details style={{ padding: "8px 28px", fontSize: 12, color: "var(--sq-smoke)" }}>
              <summary>Supplier requirements</summary>
              <p>One condition per line, such as industrial cleaning or overnight work. Conditions are mandatory unless prefixed with preferred: or exclusion:.</p>
              <textarea aria-label="Supplier requirements" rows="4" value={requirementText}
                style={{ width: "100%", color: "var(--sq-bone)", background: "var(--sq-obsidian)", border: "1px solid var(--sq-border)" }}
                onChange={e => { setRequirementText(e.target.value); setRequirementsConfirmed(false); }} />
              <label style={{ display: "block", marginTop: 8 }}>
                <input type="checkbox" checked={requirementsConfirmed} disabled={!requirementText.trim()}
                  onChange={e => setRequirementsConfirmed(e.target.checked)} /> This checklist includes all supplier conditions in my request
              </label>
              <p>Unconfirmed or unsupported conditions remain unresolved. Phrase checks are conservative and do not establish independent truth.</p>
              <label>Supplier-owned websites you have confirmed (optional)</label>
              <textarea aria-label="Confirmed supplier websites" rows="2" value={supplierSourceText}
                placeholder="Acme Cleaning | https://acme.sg"
                style={{ width: "100%", color: "var(--sq-bone)", background: "var(--sq-obsidian)", border: "1px solid var(--sq-border)" }}
                onChange={e => setSupplierSourceText(e.target.value)} />
              <p>One supplier name and website origin per line, separated by |. Unconfirmed source ownership remains unresolved. For exclusions, state the forbidden condition, for example exclusion: subcontractors.</p>
            </details>
          )}
          {screen !== "idle" && (
            <>
              <CommandBar query={query} setQuery={updateQuery} mode="auto" onRun={startHunt} running={running} onPause={haltHunt} />
              <Pipeline activePhase={activePhase} progress={progress} running={running} budget={view && !running ? view.budget : null} />
            </>
          )}

          {error && (
            <div style={{
              margin: "0", padding: "10px 28px", background: "rgba(182,92,74,0.10)",
              borderBottom: "1px solid rgba(182,92,74,0.45)", color: "#D67F6B",
              fontFamily: "var(--sq-font-mono)", fontSize: 12, display: "flex", alignItems: "center", gap: 10,
            }}>
              <SQIcon name="info" size={14}/> {error}
            </div>
          )}

          <div style={{ flex: 1, display: "flex", minHeight: 0 }}>
            <main style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", overflow: "hidden" }}>
              {screen === "idle" && (
                <HeroIdle query={query} setQuery={updateQuery} onRun={startHunt} recent={recent}
                  onPickRecent={(r) => updateQuery(r.q)} />
              )}
              {screen === "hunting" && (
                <HuntInProgress stream={stream} evidence={evidence}
                  runId={activeRunRef.current}
                  candidates={Math.min(5, Math.floor(progress * 6))} query={query}
                  activePhase={activePhase} progress={progress}
                  seamLabel={resultRef.current ? resultRef.current.qwen.label : "pipeline · running"}
                  pool={resultRef.current ? {
                    considered: resultRef.current.metrics.candidates_considered ?? 0,
                    validated: resultRef.current.metrics.validated_candidates_total ?? 0,
                    drafts: resultRef.current.metrics.rfq_drafts_total ?? 0,
                  } : null} />
              )}
              {screen === "results" && view && (
                <ResultsPane view={view} tab={tab} setTab={setTab} focusId={focusId} setFocusId={setFocusId}
                  setDetailVendor={setDetailVendor} setDraftVendor={setDraftVendor} query={query} />
              )}
            </main>

            {showRail && <SignalsRail feed="rail" signals={railSignals} ledger={railLedger} />}
          </div>
        </div>

        <VendorDetail vendor={detailVendor} onClose={() => setDetailVendor(null)}
          onDraft={(v) => { setDetailVendor(null); setDraftVendor(v); }} />

        <RfqDrawer vendor={draftVendor}
          draft={draftVendor && view ? view.rfqByVendor[draftVendor.id] : null}
          onClose={() => setDraftVendor(null)} />

        <SignalToast signal={toast} onDismiss={() => setToast(null)} onOpen={() => setToast(null)} />
      </React.Fragment>
    );
  }

  // ---- Results pane ----------------------------------------------------------
  function ResultsPane({ view, tab, setTab, focusId, setFocusId, setDetailVendor, setDraftVendor, query }) {
    const m = view.metrics || {};
    const meta = {
      retained: `${m.validated_candidates_total ?? view.vendors.length} / ${m.candidates_considered ?? view.vendors.length}`,
      quoteRate: (m.quote_channel_found_rate ?? 0).toFixed(2),
      fetches: `${m.fetch_urls_total ?? 0}`,
      ledger: `${view.ledger.length}`,
    };
    const completeness = (m.quote_channel_found_rate ?? 0).toFixed(2);
    return (
      <section className="sq-section" style={{ flex: 1, minWidth: 0, padding: "26px 32px 32px", overflow: "auto", position: "relative" }}>
        <window.WebMotif opacity={0.4}/>
        <div style={{ position: "relative" }}>
          <div className="sq-tabs" style={{ marginBottom: 22 }}>
            {[
              { k: "suppliers", label: "Suppliers", icon: "suppliers" },
              { k: "insights",  label: "Insights",  icon: "insights"  },
              { k: "contracts", label: "Contracts", icon: "contracts" },
              { k: "risks",     label: "Risks",     icon: "risks"     },
            ].map(x => (
              <button key={x.k} className="sq-tab" data-active={tab === x.k} onClick={() => setTab(x.k)}>
                <SQIcon name={x.icon} size={13}/> {x.label}
              </button>
            ))}
            <span style={{
              marginLeft: "auto", display: "flex", alignItems: "center", gap: 10,
              fontFamily: "var(--sq-font-mono)", fontSize: 11, color: "var(--sq-slate-taupe)",
              letterSpacing: "0.06em", paddingBottom: 10,
            }}>
              <span>{detectGeo(query)}</span>
              <span className="sq-mono-chip" style={{
                color: view.qwen.live ? "#A6BB87" : "var(--sq-smoke)",
                borderColor: view.qwen.live ? "rgba(122,140,94,0.5)" : "var(--sq-border)",
              }} title={view.qwen.seams.map(s => `${s.name}: ${s.enabled ? (s.mock ? "mock" : "live") : "off"}`).join("\n")}>
                {view.qwen.label}
              </span>
              <span className="sq-mono-chip" style={{ color: "var(--sq-smoke)" }}>stop · {view.result.stop_reason}</span>
            </span>
          </div>

          {tab === "suppliers" && (
            <>
            <window.Shortlist vendors={view.vendors} meta={meta} title={query}
              focusId={focusId} onFocus={setFocusId} onDetail={setDetailVendor} onDraft={setDraftVendor} />
            {(view.withheldVendors || []).length > 0 && (
              <section style={{ marginTop: 24 }}>
                <h3>Unresolved or withheld suppliers</h3>
                <p>These records do not qualify for the shortlist. Their evidence and missing conditions remain available for inspection.</p>
                {view.withheldVendors.map(v => (
                  <div key={v.id} style={{ padding: "12px 0", borderBottom: "1px solid var(--sq-border)" }}>
                    <strong>{v.name}</strong> · {v.raw.withheld_reason}
                    <button style={{ marginLeft: 16 }} onClick={() => setDetailVendor(v)}>Evidence</button>
                  </div>
                ))}
              </section>
            )}
            </>
          )}
          {tab === "insights" && <InsightsTab view={view} query={query}/>}
          {tab === "contracts" && <PlaceholderTab title="Active contracts" body="Renewal radar, evergreen clauses, expiry windows — drilling in soon."/>}
          {tab === "risks" && <RisksTab view={view}/>}
        </div>
      </section>
    );
  }

  // ---- Insights tab — real classification + budget burn-down -----------------
  function InsightsTab({ view, query }) {
    const cls = view.classification || {};
    const sig = (view.classify && view.classify.signals) || {};
    const ps = view.pricingSummary || {};
    const modes = ["service_quote_required", "product_exact_price", "contact_enrichment_only", "revalidation", "electronics_substitution"];
    return (
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        <div className="sq-card" style={{ padding: 20 }}>
          <div className="sq-overline" style={{ marginBottom: 10 }}>Query summary</div>
          <h3 style={{ margin: 0, fontFamily: "var(--sq-font-serif)", fontWeight: 500, fontSize: 22, color: "var(--sq-bone)" }}>
            {query}
          </h3>
          <p style={{ color: "var(--sq-fg-muted)", marginTop: 10, fontSize: 13.5, lineHeight: 1.55 }}>
            {cls.rationale || "Deterministic classification."} Mode auto-classified as <code>{view.result.mode}</code> at {(cls.confidence || 0).toFixed(2)} confidence.
          </p>
          <div style={{ display: "flex", gap: 24, marginTop: 18, fontFamily: "var(--sq-font-mono)", fontSize: 11, color: "var(--sq-slate-taupe)" }}>
            <Stat k="mode" v={view.result.mode.replace("_required","").replace("_only","")}/>
            <Stat k="confidence" v={(cls.confidence || 0).toFixed(2)}/>
            <Stat k="geo" v={detectGeo(query).split(" · ")[0]}/>
            <Stat k="stop" v={view.result.stop_reason}/>
          </div>
        </div>

        <div className="sq-card" style={{ padding: 20 }}>
          <div className="sq-overline" style={{ marginBottom: 10 }}>Budget burn-down</div>
          <BudgetBars view={view}/>
        </div>

        <ReasoningCard view={view}/>
        <TelemetryCard view={view}/>
        {view.frontier.enabled && <FrontierCard frontier={view.frontier}/>}

        <div className="sq-card" style={{ padding: 20, gridColumn: "1 / -1" }}>
          <div className="sq-overline" style={{ marginBottom: 14 }}>Mode classification trace</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 12 }}>
            {modes.map(k => {
              const picked = k === view.result.mode;
              const v = picked ? (cls.confidence || 0) : 0;
              return (
                <div key={k} style={{
                  padding: "12px 14px",
                  border: `1px solid ${picked ? "var(--sq-bone)" : "var(--sq-border)"}`,
                  background: picked ? "rgba(242,229,230,0.04)" : "transparent",
                }}>
                  <div style={{ fontFamily: "var(--sq-font-mono)", fontSize: 11, color: picked ? "var(--sq-bone)" : "var(--sq-smoke)" }}>{k}</div>
                  <div style={{ fontFamily: "var(--sq-font-serif)", fontSize: 24, color: picked ? "var(--sq-bone)" : "var(--sq-slate-taupe)", marginTop: 6 }}>
                    {picked ? v.toFixed(2) : "—"}
                  </div>
                  <div style={{ position: "relative", height: 2, background: "var(--sq-border)", marginTop: 8 }}>
                    <span style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${v * 100}%`, background: picked ? "var(--sq-bone)" : "var(--sq-slate-taupe)" }}/>
                  </div>
                </div>
              );
            })}
          </div>
          {Object.values(sig).some(a => Array.isArray(a) && a.length) && (
            <div style={{ marginTop: 16, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
              <span style={{ fontFamily: "var(--sq-font-mono)", fontSize: 11, color: "var(--sq-slate-taupe)" }}>matched signals ·</span>
              {Object.entries(sig).flatMap(([cat, terms]) => (terms || []).map(term => (
                <span key={cat + term} className="sq-mono-chip" style={{ color: "var(--sq-smoke)" }}>{cat.replace(/_/g," ")}: {term}</span>
              )))}
            </div>
          )}
          {Object.keys(ps).length > 0 && (
            <div style={{ marginTop: 14, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
              <span style={{ fontFamily: "var(--sq-font-mono)", fontSize: 11, color: "var(--sq-slate-taupe)" }}>pricing ·</span>
              {Object.entries(ps).map(([k, n]) => (
                <span key={k} className="sq-mono-chip" style={{ color: "var(--sq-smoke)" }}>{k} × {n}</span>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  function Stat({ k, v }) {
    return <div><div style={{ color: "var(--sq-slate-taupe)" }}>{k}</div><div style={{ color: "var(--sq-bone)", marginTop: 4 }}>{v}</div></div>;
  }

  // ---- Discovery reasoning — the real result.reasoning trace ------------------
  function ReasoningCard({ view }) {
    const rsn = view.reasoning;
    if (!rsn) return null;
    const crag = rsn.crag || {};
    const pivots = [...(rsn.corrective_queries || []), ...(rsn.replan_queries || [])];
    const Line = ({ tag, children, color }) => (
      <div style={{ display: "grid", gridTemplateColumns: "84px 1fr", gap: 12, padding: "7px 0", borderBottom: "1px dashed var(--sq-border)", fontFamily: "var(--sq-font-mono)", fontSize: 11.5, lineHeight: 1.5 }}>
        <span style={{ color: color || "var(--sq-slate-taupe)", letterSpacing: "0.06em" }}>{tag}</span>
        <span style={{ color: "var(--sq-fog)", overflowWrap: "anywhere" }}>{children}</span>
      </div>
    );
    return (
      <div className="sq-card" style={{ padding: 20 }}>
        <div className="sq-overline" style={{ marginBottom: 10 }}>Discovery reasoning</div>
        {(rsn.initial_queries || []).map((q, i) => <Line key={"iq" + i} tag={`query ${i + 1}`}>{q}</Line>)}
        {crag.verdict && (
          <Line tag="crag" color={crag.verdict === "correct" ? "#A6BB87" : crag.verdict === "incorrect" ? "#D67F6B" : "#D7A876"}>
            {crag.verdict} · confidence {(crag.confidence ?? 0).toFixed(2)} · mean relevance {(crag.mean_relevance ?? 0).toFixed(2)}
            {crag.rationale ? ` — ${crag.rationale}` : ""}
          </Line>
        )}
        {pivots.map((q, i) => <Line key={"pv" + i} tag="pivot" color="#D7A876">{q}</Line>)}
        <Line tag="rewriter">{rsn.query_rewriter || "deterministic"}</Line>
      </div>
    );
  }

  // ---- Run telemetry — per-phase latency + fetch outcomes ---------------------
  function TelemetryCard({ view }) {
    const lat = view.latency;
    const fo = view.fetchOutcomes || {};
    const phases = lat ? Object.entries(lat).filter(([k]) => k !== "total") : [];
    const total = lat && lat.total ? lat.total : phases.reduce((s, [, v]) => s + v, 0) || 1;
    return (
      <div className="sq-card" style={{ padding: 20 }}>
        <div className="sq-overline" style={{ marginBottom: 10 }}>
          Run telemetry{lat && lat.total != null ? ` · ${lat.total.toFixed(1)}s total` : ""}
        </div>
        {phases.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {phases.map(([k, v]) => (
              <div key={k} style={{ display: "grid", gridTemplateColumns: "70px 1fr 56px", alignItems: "center", gap: 12, fontFamily: "var(--sq-font-mono)", fontSize: 11 }}>
                <span style={{ color: "var(--sq-slate-taupe)" }}>{k}</span>
                <div style={{ position: "relative", height: 4, background: "var(--sq-border)" }}>
                  <span style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${Math.min(100, (v / total) * 100)}%`, background: "var(--sq-bone)" }}/>
                </div>
                <span style={{ color: "var(--sq-bone)", textAlign: "right" }}>{v.toFixed(1)}s</span>
              </div>
            ))}
          </div>
        )}
        {(Object.keys(fo).length > 0 || view.fallbackRecovered > 0) && (
          <div style={{ marginTop: 14, display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}>
            <span style={{ fontFamily: "var(--sq-font-mono)", fontSize: 11, color: "var(--sq-slate-taupe)" }}>fetch ·</span>
            {Object.entries(fo).map(([k, n]) => (
              <span key={k} className="sq-mono-chip" style={{ color: k === "ok" ? "#A6BB87" : "#D7A876" }}>{k} × {n}</span>
            ))}
            {view.fallbackRecovered > 0 && (
              <span className="sq-mono-chip" style={{ color: "#A6BB87", borderColor: "rgba(122,140,94,0.5)" }}>
                fallback recovered × {view.fallbackRecovered}
              </span>
            )}
          </div>
        )}
        {view.proofs > 0 && (
          <div style={{ marginTop: 10, fontFamily: "var(--sq-font-mono)", fontSize: 11, color: "var(--sq-slate-taupe)" }}>
            {view.proofs} citation inclusion proof(s) · RFC 6962
          </div>
        )}
      </div>
    );
  }

  // ---- Frontier — gather loop counters (only when the flag ran) ---------------
  function FrontierCard({ frontier }) {
    const rows = [
      ["rounds", frontier.rounds],
      ["leads added", frontier.added],
      ["leads popped", frontier.popped],
      ["link leads", frontier.link_leads_inserted],
      ["entity queries", frontier.entity_query_leads_inserted],
      ["entity leads fetched", frontier.entity_url_leads_fetched],
      ["pending at stop", frontier.pending_at_stop],
    ].filter(([, v]) => v != null);
    return (
      <div className="sq-card" style={{ padding: 20, gridColumn: "1 / -1" }}>
        <div className="sq-overline" style={{ marginBottom: 12 }}>Frontier gather loop</div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(120px, 1fr))", gap: 12 }}>
          {rows.map(([k, v]) => (
            <div key={k} style={{ padding: "10px 12px", border: "1px solid var(--sq-border)" }}>
              <div style={{ fontFamily: "var(--sq-font-mono)", fontSize: 10, color: "var(--sq-slate-taupe)", letterSpacing: "0.08em", textTransform: "uppercase" }}>{k}</div>
              <div style={{ fontFamily: "var(--sq-font-serif)", fontSize: 24, color: "var(--sq-bone)", marginTop: 6 }}>{v}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  function BudgetBars({ view }) {
    const b = view.budget || {};
    const m = view.metrics || {};
    const items = [
      { k: "search",   used: b.search_calls ?? 0,          cap: b.max_search_calls ?? b.search_calls ?? 1 },
      { k: "fetch",    used: b.fetch_urls ?? 0,            cap: b.max_fetch_urls ?? b.fetch_urls ?? 1 },
      { k: "extract",  used: b.candidates_extracted ?? 0,  cap: b.max_candidates_to_extract ?? b.candidates_extracted ?? 1 },
      { k: "validate", used: m.validated_candidates_total ?? 0, cap: b.max_validated_candidates ?? m.validated_candidates_total ?? 1 },
      { k: "draft",    used: m.rfq_drafts_total ?? 0,      cap: Math.max(m.rfq_drafts_total ?? 0, m.validated_candidates_total ?? 1) },
    ];
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 4 }}>
        {items.map(b2 => {
          const full = b2.cap > 0 && b2.used >= b2.cap;
          return (
            <div key={b2.k} style={{ display: "grid", gridTemplateColumns: "70px 1fr 50px", alignItems: "center", gap: 12, fontFamily: "var(--sq-font-mono)", fontSize: 11 }}>
              <span style={{ color: "var(--sq-slate-taupe)" }}>{b2.k}</span>
              <div style={{ position: "relative", height: 4, background: "var(--sq-border)" }}>
                <span style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${b2.cap ? Math.min(100, (b2.used / b2.cap) * 100) : 0}%`, background: full ? "#A6BB87" : "var(--sq-bone)" }}/>
              </div>
              <span style={{ color: "var(--sq-bone)", textAlign: "right" }}>{b2.used} / {b2.cap}</span>
            </div>
          );
        })}
      </div>
    );
  }

  function RisksTab({ view }) {
    const risks = view.signals.filter(s => s.kind === "risk" || s.kind === "warn");
    if (!risks.length) return <PlaceholderTab title="Risk signals" body="No risk or conflict signals surfaced for this run. Conflicting pricing and pending reviews appear here."/>;
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 10, maxWidth: 720 }}>
        {risks.map(s => <window.SignalCard key={s.id} signal={s}/>)}
      </div>
    );
  }

  function PlaceholderTab({ title, body }) {
    return (
      <div style={{ padding: "60px 0", color: "var(--sq-smoke)", fontFamily: "var(--sq-font-sans)", textAlign: "center" }}>
        <div className="sq-overline" style={{ marginBottom: 12 }}>{title}</div>
        <div style={{ fontFamily: "var(--sq-font-serif)", fontSize: 26, color: "var(--sq-bone)", marginBottom: 14, fontStyle: "italic" }}>Coming next.</div>
        <p style={{ maxWidth: 460, margin: "0 auto", fontSize: 13.5, color: "var(--sq-fg-muted)", lineHeight: 1.55 }}>{body}</p>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
